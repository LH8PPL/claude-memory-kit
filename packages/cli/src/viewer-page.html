  // Same race guard as the facts list: the shared search box fires per
  // keystroke on this view too.
  let decisionsSeq = 0;

  async function viewDecisions() {
    const seq = ++decisionsSeq;
    const out = $('#decisions-out');
    const { q, offset } = viewState();
    const params = new URLSearchParams();
    // NEWEST-FIRST, explicitly. The route's default is journal order (oldest
    // first — the order the kit appends in, and the chronological trail the
    // view exists to show), but page 1 of a real journal in that order is its
    // oldest 50 decisions. This tab has always been LABELLED "newest first";
    // asking for it is what makes the label true.
    params.set('order', 'newest');
    if (q) params.set('q', q);
    if (offset) params.set('offset', String(offset));
    const data = await api('/decisions?' + params);
    if (seq !== decisionsSeq) return; // a newer query went out while this flew
    clear(out);
    if (data.error) { out.append(errorCard(data)); return; }
    stamp(data, data.mode === 'search'
      ? data.total + ' hit(s) for “' + data.query + '”'
      : data.count + ' decision(s)');
    $('#dec-title').textContent = q ? 'Decisions matching “' + q + '”' : 'Decisions, newest first';
    const sub = $('#dec-sub');
    clear(sub);
    if (typeof data.total === 'number' && data.total > 0) {
      sub.append(el('b', { text: group(data.total) }));
      sub.append(q ? ' matching entries in the journal.' : ' entries — superseded and retracted ones kept, struck.');
    }
    if (!data.count) {
      const overshot = data.offset > 0;
      out.append(el('p', { class: 'empty measure', text: overshot
        ? 'No decisions on this page — you have paged past the end of ' + (q ? 'these matches.' : 'the journal.')
        : q
          ? 'Nothing in the journal matches “' + q + '”. The search is a plain substring — try fewer words.'
          : 'No decisions journaled yet. They accumulate as decisions get captured — `cmk remember --type project --why …` writes one.' }));
      if (overshot) {
        const back = pager(data, 'decisions');
        if (back) out.append(back);
        out.append(el('p', { class: 'note' }, el('a', { class: 'chip', href: hrefFor({ offset: 0 }), text: '← back to the first page' })));
      }
      return;
    }
    for (const d of data.decisions) {
      const box = el('div', { class: 'decision' + (d.retracted ? ' retracted' : '') });
      box.append(el('div', { class: 'd3', text: d.title || d.id }));
      const meta = el('div', { class: 'meta' });
      if (d.when) meta.append(el('span', { text: d.when }));
      if (d.retracted) meta.append(badge('retracted', 'state'));
      meta.append(el('a', { class: 'chip', href: '/fact/' + d.fact_id, text: d.fact_id }));
      box.append(meta);
      if (d.why) box.append(richBody(d.why));
      out.append(box);
    }
    const nav = pager(data, 'decisions');
    if (nav) out.append(nav);
  }

  // ---- the graph: the instrument ----------------------------------------
  //
  // A small force layout, hand-rolled because a library would break the
  // zero-dependency contract for something this simple. Deterministic seed, so
  // the same corpus lays out the same way twice.
  //
  // Three things changed from the previous pass, and each is load-bearing:
  //
  //  1. REPULSION SCALES WITH DEGREE. A constant charge cannot produce
  //     cluster/dandelion structure — it produces an even mesh, mathematically.
  //     A hub now pushes its own breathing room and its leaves fan around it.
  //  2. RADIUS SCALES WITH DEGREE, UNCAPPED (sqrt, so 40 links is legible not
  //     absurd). The cap flattened the only ranking the picture had.
  //  3. HUE IS COMMUNITY — three slots plus a neutral, no more. Trust moved to a
  //     RIM ARC: full ring / two-thirds / one-third. Shape survives every kind
  //     of colour blindness and frees hue for the thing hue is good at.
  const COMMUNITY = ['var(--c1)', 'var(--c2)', 'var(--c3)'];
  const NEUTRAL = 'var(--c0)';
  const TRUST_ARC = { high: 1, medium: 0.62, low: 0.28 };
  const LABEL_AT = 3;
  const LABEL_CHARS = 30;
  const NS = 'http://www.w3.org/2000/svg';
  const svgEl = (tag, attrs) => {
    const n = document.createElementNS(NS, tag);
    for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
    return n;
  };
  const svgTitle = (text) => { const t = document.createElementNS(NS, 'title'); t.textContent = text; return t; };

  /** A rim arc, opening at 12 o'clock and running clockwise. */
  function arcPath(r, frac) {
    const a0 = -Math.PI / 2;
    const a1 = a0 + 2 * Math.PI * Math.min(frac, 0.9999);
    const large = frac > 0.5 ? 1 : 0;
    const p = (a) => (r * Math.cos(a)).toFixed(2) + ' ' + (r * Math.sin(a)).toFixed(2);
    return 'M ' + p(a0) + ' A ' + r.toFixed(2) + ' ' + r.toFixed(2) + ' 0 ' + large + ' 1 ' + p(a1);
  }

  /** Connected components — the only community structure this data can honestly
      support at 4% link density, and it is stable across refreshes. */
  function communities(nodes, edges) {
    const parent = new Map(nodes.map((n) => [n.id, n.id]));
    const find = (x) => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
    for (const e of edges) {
      const a = find(e.a.id), b = find(e.b.id);
      if (a !== b) parent.set(a, b);
    }
    const sizes = new Map();
    for (const n of nodes) {
      const root = find(n.id);
      n.root = root;
      sizes.set(root, (sizes.get(root) || 0) + 1);
    }
    const ranked = [...sizes.entries()].sort((a, b) => b[1] - a[1] || String(a[0]).localeCompare(String(b[0])));
    const slot = new Map();
    ranked.forEach(([root], i) => { if (i < COMMUNITY.length) slot.set(root, i); });
    let other = 0;
    for (const n of nodes) {
      n.slot = slot.has(n.root) ? slot.get(n.root) : -1;
      if (n.slot === -1) other++;
    }
    return { sizes: ranked.slice(0, COMMUNITY.length).map(([root, size], i) => ({ i, root, size })), other };
  }

  let isolated = null;

  function applyIsolation(svg) {
    for (const node of svg.querySelectorAll('[data-slot]')) {
      const on = isolated === null || node.getAttribute('data-slot') === String(isolated);
      node.classList.toggle('dim', !on);
    }
    for (const b of $('#rail').querySelectorAll('.key[data-slot]')) {
      b.setAttribute('aria-pressed', String(isolated !== null && b.getAttribute('data-slot') === String(isolated)));
    }
  }

  function railPeek(n) {
    const rail = $('#rail');
    let box = rail.querySelector('#peek');
    if (!n) { if (box) box.remove(); return; }
    if (!box) {
      box = el('div', { id: 'peek' });
      // ABOVE the static "Reading it" key, never appended last: the peek is the
      // live answer to pointing at a node, and on a rail that only just fits it
      // was landing below the rail's own fold — the affordance produced no
      // visible feedback at all. The key is reference material and can sit at
      // the bottom; feedback cannot.
      const key = rail.querySelector('#rail-key');
      if (key) rail.insertBefore(box, key); else rail.append(box);
    }
    clear(box);
    box.append(el('h3', { text: 'Pointed at' }));
    box.append(el('div', { class: 'peek-title', text: String(n.label || n.id).replace(/\.md.*$/, '') }));
    const meta = el('div', { class: 'peek-meta' });
    const line = [n.kind === 'anchor' ? 'doc anchor' : 'fact', n.tier ? 'tier ' + n.tier : null,
      n.trust ? n.trust + ' trust' : null, n.superseded ? 'superseded' : null,
      (n.deg || 0) + ' link' + (n.deg === 1 ? '' : 's')].filter(Boolean).join(' · ');
    meta.append(el('div', { text: line }));
    meta.append(el('div', { class: 'mono', text: n.id }));
    box.append(meta);
  }

  async function viewGraph() {
    const svg = $('#graph');
    const rail = $('#rail');
    const data = await api('/graph');
    clear(svg);
    clear(rail);
    isolated = null;
    if (data.error) { rail.append(el('p', { class: 'hint', text: data.error })); return; }
    stamp(data, data.nodes.length + ' nodes · ' + data.edges.length + ' edges');

    // Drop the unlinked. A degree-0 node carries no relationship, so the layout
    // only ever pushed it to the wall — a picture-frame of orphan dots around
    // the actual shape. They are still COUNTED in the rail; nothing disappears
    // silently.
    const degree = new Map();
    for (const e of data.edges) {
      degree.set(e.src, (degree.get(e.src) || 0) + 1);
      degree.set(e.dst, (degree.get(e.dst) || 0) + 1);
    }
    const linked = data.nodes.filter((n) => degree.get(n.id));
    const unlinked = data.nodes.length - linked.length;

    // The corpus block goes up first, so a sparse canvas never reads as
    // "nothing here" — the number of facts is stated before the picture.
    const counts = el('div', {}, [
      el('h3', { text: 'Corpus' }),
      el('span', { class: 'd1', text: group(data.fact_count || data.nodes.length) }),
      el('div', { class: 'corpus-sub', text: 'facts on disk' + (data.truncated ? ' · newest ' + data.node_limit + ' considered' : '') }),
    ]);
    const dl = el('dl');
    const stat = (k, v) => { dl.append(el('dt', { text: k })); dl.append(el('dd', { text: group(v) })); };
    stat('drawn', linked.length);
    stat('links', data.edges.length);
    if (data.anchor_count) stat('doc anchors', data.anchor_count);
    if (data.archived_count) stat('superseded', data.archived_count);
    if (data.dangling_count) stat('dangling', data.dangling_count);
    if (unlinked) stat('unlinked, not drawn', unlinked);
    counts.append(dl);
    rail.append(counts);

    if (!linked.length) {
      rail.append(el('p', { class: 'hint', text: 'Nothing to draw yet — the graph fills as facts link to each other.' }));
      return;
    }

    // The box is measured ONCE, at layout time, and nothing re-reads it: there
    // is no resize handler, by design (a relayout would move every node under
    // the pointer). With `dvh` the box CAN change afterwards — a mobile URL bar
    // collapsing is the realistic case — and the SVG then letterboxes inside
    // the new box (default `preserveAspectRatio: meet`). That is the accepted
    // trade: a slightly padded picture beats a picture that jumps.
    // The fallbacks are for a canvas measured before layout; they match the
    // instrument's own floor rather than any historical fixed height.
    const W = svg.clientWidth || 900;
    const H = svg.clientHeight || 440;
    let seed = 42;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };

    const nodes = linked.map((n) => ({ ...n, x: W * (0.25 + rnd() * 0.5), y: H * (0.25 + rnd() * 0.5), vx: 0, vy: 0, deg: 0 }));
    const index = new Map(nodes.map((n) => [n.id, n]));
    const edges = data.edges.map((e) => ({ ...e, a: index.get(e.src), b: index.get(e.dst) })).filter((e) => e.a && e.b);
    for (const e of edges) { e.a.deg++; e.b.deg++; }

    const groups = communities(nodes, edges);

    // Per-node charge. THIS is the line that makes clusters: a hub carries a
    // larger charge, so it clears a hollow around itself and its leaves settle
    // into a fan instead of a lattice.
    for (const n of nodes) n.q = 1500 + 1400 * Math.sqrt(n.deg);
    const PAD = 34;
    for (let step = 0; step < 380; step++) {
      const k = 1 - step / 400;
      for (let i = 0; i < nodes.length; i++) {
        for (let j = i + 1; j < nodes.length; j++) {
          const a = nodes[i], b = nodes[j];
          let dx = a.x - b.x, dy = a.y - b.y;
          let d2 = dx * dx + dy * dy;
          if (d2 < 1) { dx = rnd() - 0.5; dy = rnd() - 0.5; d2 = 1; }
          const f = Math.sqrt(a.q * b.q) / d2;
          const d = Math.sqrt(d2);
          a.vx += (dx / d) * f; a.vy += (dy / d) * f;
          b.vx -= (dx / d) * f; b.vy -= (dy / d) * f;
        }
      }
      for (const e of edges) {
        const dx = e.b.x - e.a.x, dy = e.b.y - e.a.y;
        const d = Math.max(Math.hypot(dx, dy), 1);
        // A hub's spokes are allowed to sit further out, so the fan has room.
        const rest = 84 + 5 * Math.sqrt(Math.max(e.a.deg, e.b.deg));
        const f = (d - rest) * 0.021;
        e.a.vx += (dx / d) * f; e.a.vy += (dy / d) * f;
        e.b.vx -= (dx / d) * f; e.b.vy -= (dy / d) * f;
      }
      for (const n of nodes) {
        n.vx += (W / 2 - n.x) * 0.0025;
        n.vy += (H / 2 - n.y) * 0.0025;
        n.x = Math.min(W - PAD, Math.max(PAD, n.x + n.vx * k * 0.32));
        n.y = Math.min(H - PAD, Math.max(PAD, n.y + n.vy * k * 0.32));
        n.vx *= 0.72; n.vy *= 0.72;
      }
    }

    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const defs = document.createElementNS(NS, 'defs');
    const marker = svgEl('marker', { id: 'arrow', viewBox: '0 0 10 10', refX: '17', refY: '5', markerWidth: '6.5', markerHeight: '6.5', orient: 'auto-start-reverse' });
    marker.append(svgEl('path', { d: 'M 0 0 L 10 5 L 0 10 z', fill: 'var(--g-bad)' }));
    defs.append(marker);
    // A quiet measured grid. At 70 nodes the canvas is mostly empty, and empty
    // space reads as unfinished unless something says the space is intentional.
    const pattern = svgEl('pattern', { id: 'grid', width: '32', height: '32', patternUnits: 'userSpaceOnUse' });
    pattern.append(svgEl('circle', { cx: '1', cy: '1', r: '1', fill: 'var(--g-ink-3)', 'fill-opacity': '.14' }));
    defs.append(pattern);
    svg.append(defs);
    svg.append(svgEl('rect', { x: 0, y: 0, width: W, height: H, fill: 'url(#grid)' }));

    for (const e of edges) {
      const superseded = e.type === 'superseded_by';
      const slot = e.a.slot === e.b.slot ? e.a.slot : -1;
      const line = svgEl('line', {
        class: superseded ? 'edge edge-super' : 'edge',
        'data-slot': slot,
        x1: e.a.x, y1: e.a.y, x2: e.b.x, y2: e.b.y,
        stroke: superseded ? 'var(--g-bad)' : 'var(--g-ink-3)',
        'stroke-width': superseded ? 1.7 : 1,
        'stroke-dasharray': e.resolved ? '' : '3 3',
      });
      // Supersession is the one DIRECTED relationship on this canvas: the arrow
      // always points from the old fact at the one that replaced it.
      if (superseded) line.setAttribute('marker-end', 'url(#arrow)');
      line.append(svgTitle(e.src + ' —' + e.type + '→ ' + e.dst));
      svg.append(line);
    }

    for (const n of nodes) {
      const anchor = n.kind === 'anchor';
      const r = 4 + 2.4 * Math.sqrt(n.deg);              // uncapped, sqrt-scaled
      const fill = n.slot >= 0 ? COMMUNITY[n.slot] : NEUTRAL;
      const g = svgEl('g', { class: 'node', 'data-slot': n.slot, transform: 'translate(' + n.x.toFixed(1) + ',' + n.y.toFixed(1) + ')' });

      // Shape carries KIND: a doc anchor is a diamond, a fact is a dot.
      const body = anchor
        ? svgEl('rect', { x: -r, y: -r, width: r * 2, height: r * 2, transform: 'rotate(45)', rx: 1.5, fill })
        : svgEl('circle', { r: r.toFixed(2), fill });
      body.setAttribute('fill-opacity', n.superseded ? 0.55 : 1);
      body.append(svgTitle(n.label + (n.tier ? ' · ' + n.tier : '') + (n.trust ? ' · ' + n.trust + ' trust' : '') + (n.superseded ? ' · superseded' : '')));
      g.append(body);

      // Trust is the RIM ARC — full ring, two thirds, one third. No hue.
      const frac = TRUST_ARC[n.trust];
      if (frac) {
        g.append(svgEl('path', {
          d: arcPath(r + 3.4, frac), fill: 'none',
          stroke: n.superseded ? 'var(--g-bad)' : 'var(--g-rim)',
          'stroke-opacity': n.superseded ? 0.9 : 0.72,
          'stroke-width': 1.6, 'stroke-linecap': 'round',
        }));
      }

      const standing = anchor || n.deg >= LABEL_AT;
      let cls = 'lbl';
      if (standing) cls += ' lbl-on';
      if (anchor) cls += ' anchor-label';
      const label = svgEl('text', { class: cls, x: (r + 7).toFixed(1), y: 4 });
      const full = anchor ? n.id.replace(/^anchor:/, '') : String(n.label).replace(/\.md.*$/, '');
      // Slice CODE POINTS, not UTF-16 units: a label ending on an astral char
      // would otherwise be cut mid-surrogate and render as U+FFFD.
      const cps = Array.from(full);
      label.textContent = cps.length > LABEL_CHARS ? cps.slice(0, LABEL_CHARS - 1).join('') + '…' : full;
      g.append(label);

      // Pointing at a node fills the rail's peek block; the block does not exist
      // until then. Clicking still navigates to the record — unchanged.
      g.addEventListener('pointerenter', () => railPeek(n));
      g.addEventListener('pointerleave', () => railPeek(null));
      if (!anchor) {
        const link = svgEl('a', { href: '/fact/' + n.id });
        link.addEventListener('focus', () => railPeek(n));
        link.addEventListener('blur', () => railPeek(null));
        link.append(g);
        svg.append(link);
      } else {
        svg.append(g);
      }
    }

    // ---- the rail: legend, click to isolate ----
    const legend = el('div', {}, [el('h3', { text: 'Clusters' })]);
    const keys = el('div', { class: 'keys' });
    const letters = ['A', 'B', 'C'];
    groups.sizes.forEach((c) => {
      const btn = el('button', { type: 'button', class: 'key', 'data-slot': String(c.i), 'aria-pressed': 'false' }, [
        el('span', { class: 'swatch', style: 'background:' + COMMUNITY[c.i] }),
        el('span', { text: 'cluster ' + letters[c.i] }),
        el('span', { class: 'n', text: group(c.size) }),
      ]);
      btn.addEventListener('click', () => {
        isolated = isolated === c.i ? null : c.i;
        applyIsolation(svg);
      });
      keys.append(btn);
    });
    if (groups.other) {
      const btn = el('button', { type: 'button', class: 'key', 'data-slot': '-1', 'aria-pressed': 'false' }, [
        el('span', { class: 'swatch', style: 'background:' + NEUTRAL }),
        el('span', { text: 'other clusters' }),
        el('span', { class: 'n', text: group(groups.other) }),
      ]);
      btn.addEventListener('click', () => { isolated = isolated === -1 ? null : -1; applyIsolation(svg); });
      keys.append(btn);
    }
    legend.append(keys);
    legend.append(el('p', { class: 'hint', text: 'Three hues is the honest limit on a dark all-pairs canvas; past that, structure is carried by position and labels. Click a cluster to isolate it.' }));
    rail.append(legend);

    const key = el('div', { id: 'rail-key' }, [el('h3', { text: 'Reading it' })]);
    const staticKeys = el('div', { class: 'keys' });
    const rimKey = (frac, text) => {
      const sw = document.createElementNS(NS, 'svg');
      sw.setAttribute('width', '14'); sw.setAttribute('height', '14'); sw.setAttribute('viewBox', '-7 -7 14 14');
      sw.setAttribute('aria-hidden', 'true');
      sw.append(svgEl('circle', { r: 2.4, fill: 'var(--g-ink-3)' }));
      sw.append(svgEl('path', { d: arcPath(5.2, frac), fill: 'none', stroke: 'var(--g-rim)', 'stroke-width': 1.6, 'stroke-linecap': 'round' }));
      const row = el('div', { class: 'key-static' });
      row.append(sw);
      row.append(el('span', { text }));
      return row;
    };
    staticKeys.append(rimKey(1, 'full rim — high trust'));
    staticKeys.append(rimKey(0.62, 'two thirds — medium'));
    staticKeys.append(rimKey(0.28, 'one third — low'));
    staticKeys.append(el('div', { class: 'key-static' }, [
      el('span', { class: 'swatch diamond', style: 'background:var(--g-ink-2)' }),
      el('span', { text: 'diamond — doc anchor' }),
    ]));
    const arrowSw = document.createElementNS(NS, 'svg');
    arrowSw.setAttribute('width', '14'); arrowSw.setAttribute('height', '14'); arrowSw.setAttribute('viewBox', '0 0 14 14');
    arrowSw.setAttribute('aria-hidden', 'true');
    arrowSw.append(svgEl('line', { x1: 1, y1: 7, x2: 9, y2: 7, stroke: 'var(--g-bad)', 'stroke-width': 1.7 }));
    arrowSw.append(svgEl('path', { d: 'M 9 3.5 L 13 7 L 9 10.5 z', fill: 'var(--g-bad)' }));
    staticKeys.append(el('div', { class: 'key-static' }, [arrowSw, el('span', { text: 'arrow — points at the successor' })]));
    staticKeys.append(el('div', { class: 'key-static' }, [
      el('span', { class: 'swatch', style: 'background:var(--g-ink-2);width:16px;height:6px;border-radius:2px' }),
      el('span', { text: 'size — number of links' }),
    ]));
    key.append(staticKeys);
    rail.append(key);
  }

  // ---- routing ----------------------------------------------------------
  //
  // The toolbar is ONE element, MOVED into the showing view's `.tb-slot`
  // (appending an existing node relocates it). Two search inputs would mean two
  // debounces and two states, and the second one is always the one that ends up
  // out of sync with the URL.
  const SEARCHABLE = {
    facts: { noun: 'your memory', tier: true },
    decisions: { noun: 'the decision journal', tier: false },
  };
  const toolbar = $('#toolbar');

  function show(view) {
    for (const s of document.querySelectorAll('section[data-view]')) {
      s.classList.toggle('hidden', s.dataset.view !== view);
    }
    for (const a of document.querySelectorAll('nav a')) {
      const on = a.dataset.nav === view || (view === 'fact' && a.dataset.nav === 'facts');
      if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
    }
    const spec = SEARCHABLE[view];
    const slot = spec ? document.querySelector('section[data-view="' + view + '"] .tb-slot') : null;
    toolbar.classList.toggle('hidden', !slot);
    if (!slot) return;
    slot.append(toolbar);
    // The tier filter is a FACTS concept — a journal has no tiers, so on the
    // decisions view the control is hidden rather than left there filtering
    // nothing.
    $('#tier').classList.toggle('hidden', !spec.tier);
    $('#q').placeholder = 'Search ' + spec.noun + '…';
    $('#q').setAttribute('aria-label', 'Search ' + spec.noun);
  }

  function currentRoute() {
    const p = location.pathname.replace(/\.json$/, '');
    if (p.startsWith('/fact/')) return { view: 'fact', id: decodeURIComponent(p.slice(6)) };
    if (p === '/graph' || p === '/health' || p === '/decisions') return { view: p.slice(1) };
    return { view: 'facts' };
  }

  async function render() {
    const route = currentRoute();
    show(route.view);
    // The box follows the URL, never the other way round — otherwise a back
    // button, a pasted link and a nav click each paint a different query than
    // the one the box is showing.
    const wanted = viewState().q;
    if ($('#q').value !== wanted) $('#q').value = wanted;
    const wantedTier = viewState().tier;
    if ($('#tier').value !== wantedTier) $('#tier').value = wantedTier;
    setStampBase('reading…');
    paintStrip();
    const job = (async () => {
      if (route.view === 'fact') return viewFact(route.id);
      if (route.view === 'graph') return viewGraph();
      if (route.view === 'health') return viewHealth();
      if (route.view === 'decisions') return viewDecisions();
      return viewFacts();
    })();
    await job.catch((err) => { setStampBase('failed: ' + err.message); });
  }

  function go(href) {
    history.pushState({}, '', href);
    render();
  }

  document.addEventListener('click', (ev) => {
    const a = ev.target.closest ? ev.target.closest('a[href^="/"]') : null;
    if (!a || ev.metaKey || ev.ctrlKey || ev.shiftKey || a.target) return;
    ev.preventDefault();
    go(a.getAttribute('href'));
  });
  window.addEventListener('popstate', render);

  // Typing narrows the view you are ON — facts or decisions — and always
  // returns to page 1 (setQuery). From any other view it takes you to the
  // facts list, which is what a search box in the memory product means.
  function searchHere() {
    const view = currentRoute().view;
    if (view === 'facts') { setQuery({ q: $('#q').value.trim(), tier: $('#tier').value }); return viewFacts(); }
    if (view === 'decisions') { setQuery({ q: $('#q').value.trim() }); return viewDecisions(); }
    return go('/facts' + (($('#q').value.trim()) ? '?q=' + encodeURIComponent($('#q').value.trim()) : ''));
  }

  let debounce;
  $('#q').addEventListener('input', () => {
    clearTimeout(debounce);
    debounce = setTimeout(searchHere, 220);
  });
  $('#tier').addEventListener('change', searchHere);
  // Manual refresh stays — it is the fallback when the stream is gone, and the
  // only control on the graph.
  // Refresh is what ANSWERS the graph's stale badge, so it has to clear it —
  // and only it, never the 'gone' state, which a re-read cannot fix.
  $('#refresh').addEventListener('click', () => {
    if (liveState === 'stale') setLive('on');
    render();
  });

  // ---- live refresh (Task 259, design §24.1.6) --------------------------
  //
  // The server polls the tier and tells us WHEN it changed, never WHAT changed
  // (see viewer.mjs's note on why the stream is a notification): so the response
  // to a change is to re-run the view we are already on, through the same API
  // and with the same URL state. Nothing about the reader's position moves.
  //
  // THE GRAPH IS THE ONE EXCEPTION, and it is deliberate. Every other view
  // repaints into the same layout; the graph re-runs a force simulation, so an
  // automatic refresh would move every node — possibly the one under the
  // reader's cursor, mid-click. It gets told, and refreshes when asked.
  //
  // THE DROP CASE is the interesting one, because of what this server IS. It is
  // ephemeral (§24.1.1): Ctrl-C ends it, and the next `cmk view` binds a
  // DIFFERENT port. So when the stream dies there is nothing for this page to
  // reconnect to — the port in our address bar is gone for good. A browser's
  // EventSource does not know that and will retry forever, which would leave a
  // dead tab quietly burning reconnects. So we count failures, give up after a
  // bounded few, close the stream ourselves, and SAY so. The two things this
  // must never be are the two easy ones: silent staleness (a page that looks
  // live and is a photograph) and infinite retry noise.
  const LIVE_GIVE_UP = 3;
  let liveState = 'off'; // 'off' | 'on' | 'stale' | 'gone'
  let liveSource = null;
  let failures = 0;

  // ONE variable owns the live half of the stamp, because the alternative — a
  // separate `graphStale` boolean next to the rendered text — lets the two
  // disagree: clearing the flag on Refresh left the words "memory changed —
  // Refresh to see them" sitting under a view that had just been refreshed,
  // which is a control lying about what it did (the same defect class as a
  // theme button still reading "Light" on a light page).
  function setLive(state) {
    liveState = state;
    if (state === 'on') liveSuffix = ' · live';
    else if (state === 'stale') liveSuffix = ' · memory changed — Refresh to see them';
    else if (state === 'gone') liveSuffix = ' · live off (server stopped — restart `cmk view` and reload)';
    else liveSuffix = '';
    paintFreshness();
  }

  function onLiveChange() {
    // The graph redraws its whole force layout, so refreshing it automatically
    // would move every node — possibly the one under the cursor, mid-click. It
    // is told, and redraws when asked.
    if (currentRoute().view === 'graph') return setLive('stale');
    render();
  }

  function startLive() {
    if (!window.EventSource) return; // no stream available: manual Refresh, as before
    let es;
    try {
      // Same-origin and RELATIVE — which is what `connect-src 'self'` in the
      // CSP permits, and what keeps the ephemeral port out of the markup.
      es = new EventSource('/events');
    } catch (_) {
      return;
    }
    liveSource = es;
    // A reconnect must not paint over an unanswered stale badge: the graph is
    // still showing pre-change data, and the stream being healthy again does
    // not make that untrue.
    const connected = () => { failures = 0; if (liveState !== 'stale') setLive('on'); };
    es.addEventListener('hello', connected);
    es.addEventListener('change', () => { failures = 0; onLiveChange(); });
    es.onopen = connected;
    es.onerror = () => {
      // EventSource reports an error per failed reconnect attempt and keeps
      // going. A handful in a row on an ephemeral server means the server is
      // not coming back on this port.
      failures += 1;
      if (failures < LIVE_GIVE_UP) return;
      es.close();
      liveSource = null;
      setLive('gone');
    };
  }

  // Let go of the stream when the tab does, so a reload does not leave the
  // server holding a response for a client that no longer exists.
  window.addEventListener('pagehide', () => { if (liveSource) liveSource.close(); });

  // ---- the theme toggle -------------------------------------------------
  // The head stamp owns the state, the storage key, and the writing of
  // both; this owns the LABEL. It names the theme the next click moves to, so
  // it has to be repainted the moment the theme changes — a button still
  // reading "Light" on a light page is a control that lies about what it does,
  // and it lies to a screen reader in the same breath.
  const themeBtn = $('#theme-toggle');
  if (window.cmkTheme) {
    const paintTheme = (theme) => {
      const target = theme === 'light' ? 'dark' : 'light';
      themeBtn.textContent = target === 'light' ? 'Light' : 'Dark';
      const label = 'Switch to the ' + target + ' theme';
      themeBtn.setAttribute('aria-label', label);
      themeBtn.title = label;
    };
    paintTheme(window.cmkTheme.current());
    themeBtn.addEventListener('click', () => paintTheme(window.cmkTheme.toggle()));
  } else {
    // The stamp is the module's only definition site and it cannot throw past
    // its own guards — but EVERY view on this page is rendered from this one
    // script, so an unguarded reference here would cost the reader their whole
    // memory to save a button. Drop the control instead: a toggle that is gone
    // is honest, a toggle that does nothing when clicked is not.
    themeBtn.remove();
  }

  $('#project-path').textContent = location.host;
  render();
  startLive();
})();
</script>
</body>
</html>
