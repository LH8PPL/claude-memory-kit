<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>cmk view — your memory</title>
<!--
  The kit's memory viewer (Task 255, design §24; visual pass 3).

  ONE file, on purpose. No framework, no bundler, no CDN, no build step, no
  fetched font, no image byte — the page is a plain consumer of the read API the
  same server exposes, and the response's CSP (`default-src 'none'`) means a
  stray external reference fails loudly rather than silently working on the
  author's machine.

  It is READ-ONLY and it stays that way: this page never issues a request with a
  method other than GET. The answer to "let me delete this from here" is the
  copy-able `cmk forget` command on every fact.

  VISUAL DIRECTION.

  Original position (ratified 2026-08-04, memo §3 — kept as the decision trail):
  "an instrument panel over a warm archive". Everything you READ was a warm
  LIGHT document, and exactly one region — the graph — was permanently dark.

  Revised 2026-08-08 (D-432, the user's call): the product lives beside a
  terminal and dies with it (Ctrl-C), so it is built out of the same material —
  warm near-black, warm bone ink, exactly ONE accent (amber, drawn from the
  ground's own hue family). DARK IS THE DEFAULT and the warm-light palette
  stays fully supported. The graph is still the hero: it is now the hero by
  being DEEPER than the page and by holding the only dense saturation in the
  product, rather than by being the only dark thing on it.

  DARK IS THE DEFAULT FOR EVERYONE — not for whoever's OS already agreed with
  us. The first cut of the revision above expressed "default" as `:root` dark
  under a `prefers-color-scheme: light` override, which quietly handed the
  decision back to the operating system: on a light-preferring machine the page
  was byte-for-byte the same as before, and the verdict on it was "looks the
  same to me". So the choice is now the READER's and nobody else's — the script
  at the end of this head stamps `data-theme` before the first paint (the
  stored choice, else dark, never the system preference), and the button in the
  header flips it and remembers.
-->
<style>
  /* ---------------------------------------------------------------------
     Tokens.

     Two colour spaces, deliberately:

       1. the ARCHIVE — `--ground` / `--panel` / `--ink`. Warm near-black under
          warm bone by DEFAULT; warm paper under warm ink when the reader has
          asked for light. Everything you read.
       2. the INSTRUMENT — `--g-*`. A deeper, more saturated canvas for the
          graph, IDENTICAL in both themes — the graph is one object and an object
          does not change material when the room lights change. It sits below
          `--ground` in both, so it reads as a distinct instrument inside a dark
          page and as the one dark region inside a light one.

     TWO blocks, and each palette is written exactly ONCE: `:root` is dark — the
     identity, and what you get with nothing stored — and `:root[data-theme=
     "light"]` is the override. The page stamps `data-theme` on the root element
     before the first paint (the script at the end of this head), so the
     attribute is always present and the override always wins when it should.

     (Element names are written WITHOUT angle brackets in this file's comments
     on purpose: an HTML analyser reads a bracketed tag inside a comment as a
     real element, and a stray second root element makes it report this page as
     having no `lang` and no title. Prose should not be parseable as markup.)

     There is deliberately no `@media (prefers-color-scheme: light)` here. It
     shipped in the first dark pass and it is what made D-432 under-deliver: it
     handed the DEFAULT back to the operating system, so every reader on a
     light-preferring machine got the light page and never saw the dark design
     at all. Since the stamp runs on every load the block could never apply
     again — but the reason it is deleted rather than left as a dead layer is
     that CSS asserting "the OS decides" is CSS stating the policy this page
     reversed. There is no `[data-theme="dark"]` block either: `:root` IS dark,
     so a dark override would override nothing. Both deletions remove a
     duplicate palette, and a test pins that every theme-varying token is
     declared exactly twice in this sheet — once here, once in light.

     Every hue also carries its channels as `--*-rgb`: the ONE badge/tint rule is
     an `rgba(<hue>, var(--tint))` fill under an `rgba(<hue>, var(--tint-line))`
     hairline, and a literal rgba pair is safer than a colour-mixing function.
     The two alphas are per-theme (dark carries more of both, because a wash has
     less to work with over a near-black ground), which is why they are tokens
     rather than the numbers this comment used to name.

     Ink and hue values are pinned by the contrast test — body text clears AA
     4.5:1 on every surface it can land on, and 11px/600 badge text is held to
     the same 4.5:1 (it does not earn the large-text exemption). Do not lighten
     one without re-running that test.
     --------------------------------------------------------------------- */
  :root {
    /* ONE polarity by default. The whole product is warm dark — the same
       material as the terminal it is launched from. Ink is warm bone, not white;
       the ground is warm near-black, not navy and not neutral grey. `dark` is
       listed first so a UA with no user preference lands on the identity. */
    color-scheme: dark light;

    /* Surfaces. A real ladder, and ORDERED: in dark, elevation is lightness
       upward, so ground (page) < sunken (recessed) < panel (raised). */
    --ground: #1a1714;
    --panel: #221f1b;          --panel-rgb: 34,31,27;
    --panel-hover: #2a2622;
    /* The reference skin put `--sunken` at #15120f, BELOW `--ground` — which
       breaks design §24.1.2's ORDERED-ladder rule (in dark: panel > sunken >
       ground) and its test. Raised to sit between ground and panel, in the same
       warm hue family. */
    --sunken: #1e1b17;
    --line: #38322a;
    --line-soft: #2c2822;

    --ink: #ece5d7;
    --ink-2: #b9ae9c;
    /* Reference value was #9d9384, which computes to 4.23:1 for 11px/600 badge
       text on its own tint over `--panel` — the one pair in the skin that fails
       AA. Lifted two steps up the same warm ramp: 4.59:1 badge, 5.99:1 as plain
       text. Do not put it back without re-running the contrast test — and note
       the CHANNELS are half of the token: the first cut of this lift left
       `--ink-3-rgb` on the rejected value's channels, so every ink-3 badge was
       still mixing its wash out of #9d9384 with the AA test green (it reads the
       hex). A test now pins every `--X-rgb` to its own `--X`. */
    --ink-3: #a59b8c;          --ink-3-rgb: 165,155,140;

    /* ONE accent, and it belongs to the ground's own hue family. The violet was
       a second, colder colour system laid over a warm page. Amber doubles as the
       WARN hue on purpose: fewer hues is more designed, and the two never
       contradict each other (both mean "look here"). */
    --accent: #e9b45c;         --accent-rgb: 233,180,92;
    --ok: #6cc78d;             --ok-rgb: 108,199,141;
    --warn: #e9b45c;           --warn-rgb: 233,180,92;
    --bad: #ef8a7e;            --bad-rgb: 239,138,126;

    /* Tier is MONOCHROME in dark. P/L/U in a fixed left column is the most
       repeated element on the page; with ONE accent there is no hue budget left
       to spend three ways, and `--tier-l: var(--accent)` would collide with both
       `--accent` and `--warn`. The LETTER carries the meaning. Hex and channels
       agree deliberately (both are `--ink-2`): the AA test reads the hex for
       BOTH the text and its own tint, so a split pair would measure something
       the page never renders. Light keeps its hue-coded tiers — see below. */
    --tier-p: #b9ae9c;         --tier-p-rgb: 185,174,156;
    --tier-l: #b9ae9c;         --tier-l-rgb: 185,174,156;
    --tier-u: #b9ae9c;         --tier-u-rgb: 185,174,156;

    --tint: .16;
    --tint-line: .30;

    /* --- the instrument. Fixed in both themes. ---
       With the page itself dark, the graph is no longer the hero by being the
       only dark thing: it is the hero by being DEEPER than `--ground` and by
       holding the only dense saturation in the product.

       Community hue budget is THREE plus a neutral, by arithmetic: a node-link
       graph is an all-pairs form, and on this canvas slot 4 fails normal-vision
       separation and slot 5 fails deuteranopia outright. Structure past three
       communities is carried by POSITION and LABELS. Trust is a rim ARC, not a
       fill — colourblind-immune, and it keeps hue free for community. */
    --g-canvas: #131110;
    --g-canvas-2: #0f0d0c;     /* the rail, one step deeper than the plot */
    --g-line: #322c25;
    --g-ink: #ece5d7;
    --g-ink-2: #b8afa0;
    --g-ink-3: #948b7d;        --g-ink-3-rgb: 148,139,125;
    --g-rim: #efe9dc;
    --c1: #7fb0ff;             --c1-rgb: 127,176,255;
    --c2: #e8b04b;             --c2-rgb: 232,176,75;
    --c3: #e58fc8;             --c3-rgb: 229,143,200;
    --c0: #93897a;             --c0-rgb: 147,137,122;
    --g-bad: #f0766c;          --g-bad-rgb: 240,118,108;

    /* rhythm: 4/8/12/16/20/24/32/48 */
    --measure: 720px;
    --shell: 1120px;
    --r-card: 12px;
    --r-ctl: 8px;
    --r-pill: 99px;

    /* System fonts only, and the stack is the one design §24.1.2 ratifies —
       `system-ui` first, the Segoe UI *Variable* families deliberately NOT
       named. Changing it is a contract change: amend §24.1.2 first, then the
       CSS. The display tier is a separate token because the tier is real (size,
       weight, tracking), not because it resolves to a different family. */
    --ui: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    --display: system-ui, -apple-system, "Segoe UI",
          Roboto, "Helvetica Neue", Arial, sans-serif;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, "Cascadia Mono", Consolas,
            "Liberation Mono", monospace;
  }
  /* ---- LIGHT: supported, not default ----------------------------------
     The warm-paper archive, unchanged from the ratified 2026-08-04 direction.
     It is a DESIGN, not an inversion of the block above: its own ladder, its own
     ink ramp, its own hue-coded tiers (light has the accent budget dark does
     not, because its accent is not also the warn hue).

     Reached ONE way: the reader pressed the button in the header. The stamp
     writes `data-theme="light"` and remembers it, so this block is the light
     theme's only home — `--g-*`, the rhythm and the font stacks are not
     repeated here because they do not vary by theme.
     -------------------------------------------------------------------- */
  :root[data-theme="light"] {
    color-scheme: light dark;

    --ground: #f4f2ed;
    --panel: #ffffff;        --panel-rgb: 255,255,255;
    --panel-hover: #f8f6f2;
    --sunken: #eae5db;
    --line: #d8d2c6;
    --line-soft: #e5e0d5;

    --ink: #2b2520;
    --ink-2: #5a5248;
    --ink-3: #676158;        --ink-3-rgb: 103,97,88;

    --accent: #6044dd;       --accent-rgb: 96,68,221;
    --ok: #176f30;           --ok-rgb: 23,111,48;
    --warn: #805a14;         --warn-rgb: 128,90,20;
    --bad: #b6271e;          --bad-rgb: 182,39,30;

    --tier-p: #085dc2;       --tier-p-rgb: 8,93,194;
    --tier-l: #6044dd;       --tier-l-rgb: 96,68,221;
    --tier-u: #8b5416;       --tier-u-rgb: 139,84,22;

    --tint: .13;
    --tint-line: .28;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--ground); color: var(--ink);
    font: 14px/1.6 var(--ui);
    -webkit-font-smoothing: antialiased;
  }
  code, .mono { font-family: var(--mono); font-variant-numeric: tabular-nums slashed-zero; }
  a { color: var(--accent); }
  a:hover { color: var(--ink); }

  :focus { outline: none; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }

  /* THE micro-label — one uppercase tier for every eyebrow and column head. */
  .micro, .block h3, .hid, .rail h3 {
    font-size: 11px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .12em; color: var(--ink-3);
  }

  /* ---- display tier ----------------------------------------------------
     The page had no type above 16px and a 1.45× total range. Three real steps
     now sit above the UI: 56 (the corpus figure), 30 (view title), 20 (record
     title), each with a tracking ramp that tightens as it grows.
     -------------------------------------------------------------------- */
  .d1, .d2, .d3 { font-family: var(--display); color: var(--ink); text-wrap: balance; }
  .d1 { font-size: 56px; line-height: 1.0; font-weight: 620; letter-spacing: -.035em;
        font-variant-numeric: tabular-nums; }
  .d2 { font-size: 30px; line-height: 1.14; font-weight: 600; letter-spacing: -.022em; }
  .d3 { font-size: 20px; line-height: 1.3; font-weight: 600; letter-spacing: -.014em; }

  /* ---- chrome ---------------------------------------------------------- */
  header {
    position: sticky; top: 0; z-index: 5;
    background: rgba(var(--panel-rgb), .84);
    -webkit-backdrop-filter: saturate(1.5) blur(12px);
    backdrop-filter: saturate(1.5) blur(12px);
    border-bottom: 1px solid var(--line);
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header { background: var(--panel); }
  }
  .bar { max-width: var(--shell); margin: 0 auto; padding: 13px 24px 0; }
  .brand { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .brand h1 { font-size: 15px; font-weight: 650; margin: 0; letter-spacing: -.015em; }
  .brand .path { color: var(--ink-3); font-size: 12px; }
  .brand .ro {
    margin-left: auto; font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; border-radius: var(--r-pill); padding: 3px 10px;
    color: var(--ink-3);
    background: rgba(var(--ink-3-rgb), .10);
    border: 1px solid rgba(var(--ink-3-rgb), var(--tint-line));
  }
  /* The theme toggle wears the pill idiom of the read-only stamp it sits beside
     — this is chrome, and chrome is quiet — but it is the one CONTROL up here,
     so it is a step louder: `--ink-2` rather than `--ink-3`, and it answers to
     hover. It overrides the shared control rule below (0,2,0 beats 0,0,1), so
     it does not inherit the toolbar's 8px box. The wash is the ONE badge rule's
     `rgba(<hue>, var(--tint))` rather than a literal alpha, which is also what
     lets the AA test compute the pair it actually renders. */
  .brand .theme {
    font: inherit; font-size: 11px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; border-radius: var(--r-pill); padding: 3px 10px;
    cursor: pointer;
    color: var(--ink-2);
    background: rgba(var(--ink-3-rgb), var(--tint));
    border: 1px solid rgba(var(--ink-3-rgb), var(--tint-line));
    transition: color .15s ease, border-color .15s ease;
  }
  .brand .theme:hover { color: var(--ink); border-color: var(--ink-3); }
  /* Tabs share a boundary with the page: an underline rail, not five floating
     pills. The rail is the same hairline the content rows use. */
  nav { display: flex; gap: 2px; margin-top: 10px; flex-wrap: wrap; }
  nav a {
    text-decoration: none; padding: 9px 12px 11px; margin-bottom: -1px;
    color: var(--ink-3); font-size: 13.5px; font-weight: 500;
    border-bottom: 2px solid transparent;
    transition: color .15s ease, border-color .15s ease;
  }
  nav a:hover { color: var(--ink); }
  nav a[aria-current="page"] { color: var(--ink); font-weight: 600; border-bottom-color: var(--accent); }

  main { max-width: var(--shell); margin: 0 auto; padding: 24px 24px 88px; }
  .measure { max-width: var(--measure); }

  /* ---- the pinned health strip ----------------------------------------- */
  /* Quiet by default: an inline pill. The bar shape is LOUD and is earned only
     by the rungs that mean something is wrong. Text and state semantics are the
     server's (§24.1.1); only shape changes here. */
  /* The strip and the freshness stamp share one status line at MAIN level, so
     the stamp is on screen for every view — it belongs to the page, not to the
     search toolbar (§24.1.6: freshness is stated per view, never implied). */
  .statusline { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; margin: 0 0 24px; }
  #health-strip {
    display: inline-flex; align-items: center; gap: 8px;
    margin: 0; padding: 5px 13px 5px 11px;
    border-radius: var(--r-pill); font-size: 12.5px;
    color: var(--ink-3);
    background: rgba(var(--ink-3-rgb), .10);
    border: 1px solid rgba(var(--ink-3-rgb), var(--tint-line));
  }
  #health-strip[data-state="ok"] {
    color: var(--ok);
    background: rgba(var(--ok-rgb), var(--tint));
    border-color: rgba(var(--ok-rgb), var(--tint-line));
  }
  #health-strip[data-state="warn"],
  #health-strip[data-state="bad"] {
    display: flex; width: 100%;
    border-radius: var(--r-card); padding: 10px 14px; font-size: 13.5px;
  }
  #health-strip[data-state="warn"] {
    color: var(--warn);
    background: rgba(var(--warn-rgb), var(--tint));
    border-color: rgba(var(--warn-rgb), var(--tint-line));
  }
  #health-strip[data-state="queued"] {
    color: var(--accent);
    background: rgba(var(--accent-rgb), var(--tint));
    border-color: rgba(var(--accent-rgb), var(--tint-line));
  }
  #health-strip[data-state="bad"] {
    color: var(--bad);
    background: rgba(var(--bad-rgb), var(--tint));
    border-color: rgba(var(--bad-rgb), var(--tint-line));
  }
  #health-strip .dot { width: 7px; height: 7px; border-radius: var(--r-pill); background: currentColor; flex: none; }
  #health-strip .fix { margin-left: 10px; color: inherit; }
  #health-strip[data-state="warn"] .fix,
  #health-strip[data-state="bad"] .fix { margin-left: auto; }

  /* ---- the overview -----------------------------------------------------
     The landing used to show 50 of ~2,300 facts and never say so. The corpus
     figure is now the largest thing on the page, and the fraction on screen is
     stated underneath it rather than left to be discovered.
     -------------------------------------------------------------------- */
  .overview { margin: 0 0 26px; }
  /* The graph view's header is deliberately one compact line: the instrument
     is the content here, and the prose that used to sit above it said the same
     thing as the rail's own legend. Two copies of an explanation cost a screen. */
  .overview-tight { margin: 0 0 12px; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  /* Both classes are on the same element and `.overview .micro` below is the
     later rule, so this has to out-specify it — `.overview-tight .micro`
     (0,2,0) lost the tie and the eyebrow went back to its own block line. */
  .overview.overview-tight .micro { display: inline; margin: 0; }
  /* `main` carries 88px of footer padding, which is right for a scrolling list
     and wrong under an instrument that already fills the window — it would buy
     a ~40px scrollbar that reveals nothing. Claw most of it back on this view
     only, so the graph and its rail fit the window with no page scroll.
     Only above the instrument's own min-height floor: on a shorter window the
     page scrolls anyway, and there the rule just steals the footer padding. */
  @media (min-height: 700px) {
    section[data-view="graph"] { margin-bottom: -64px; }
  }
  .overview .micro { display: block; margin-bottom: 10px; }
  .overview .d1 { display: block; }
  .overview .sub {
    margin-top: 10px; color: var(--ink-2); font-size: 14px; max-width: 46ch;
    text-wrap: pretty;
  }
  .overview .sub b { color: var(--ink); font-weight: 600; font-variant-numeric: tabular-nums; }

  /* ---- controls -------------------------------------------------------- */
  .toolbar { display: flex; gap: 8px; align-items: center; margin: 0 0 18px; flex-wrap: wrap; }
  input[type="search"], select, button {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: var(--r-ctl); padding: 8px 11px;
    transition: border-color .15s ease;
  }
  input[type="search"] { flex: 1 1 280px; min-width: 180px; }
  input[type="search"]::placeholder { color: var(--ink-3); }
  select { max-width: 180px; }
  button { cursor: pointer; font-weight: 500; }
  button:hover, input[type="search"]:hover, select:hover { border-color: var(--ink-3); }
  #freshness { color: var(--ink-3); font-size: 12px; margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ---- the pager -------------------------------------------------------
     Prev/next over a stable sort, NOT an infinite scroll. A memory archive is
     navigated deliberately and a position in it has to be citeable — an
     infinite list has no URL for "the page that has the fact I mean". So both
     controls are real anchors carrying the whole view state, and the end of the
     range is a SPAN, because a link that goes nowhere is a lie a cursor tells.
     -------------------------------------------------------------------- */
  .pager {
    display: flex; align-items: center; gap: 12px;
    margin: 18px 2px 0; font-size: 12.5px; color: var(--ink-3);
    font-variant-numeric: tabular-nums;
  }
  .pager .page-btn, .pager .page-btn-off {
    border: 1px solid var(--line); border-radius: var(--r-ctl);
    padding: 6px 13px; text-decoration: none; font-weight: 500; line-height: 1.5;
    transition: border-color .15s ease, color .15s ease;
  }
  .pager .page-btn { color: var(--ink-2); }
  .pager .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .pager .page-btn-off { color: var(--ink-3); opacity: .5; cursor: default; }
  .pager .range { margin: 0 auto; }
  .pager .range b { color: var(--ink-2); font-weight: 600; }

  /* ---- relevance bands (D-429) -----------------------------------------
     A weak match must LOOK weak. The pill carries the WORD and the hue only
     reinforces it — same discipline as the graph's trust rim-arc: colour is
     never the sole encoding, so this survives colour blindness and greyscale.
     The hues are the kit's existing good→poor ladder (`--ok`/`--warn`/`--bad`,
     already AA-tested on both surfaces in both themes) — a third reading of the
     same ladder trust levels and health statuses already use, not a fourth
     colour system.
     -------------------------------------------------------------------- */
  .rel-strong { --hue: var(--ok); --hue-rgb: var(--ok-rgb); }
  .rel-fair { --hue: var(--warn); --hue-rgb: var(--warn-rgb); }
  .rel-weak { --hue: var(--bad); --hue-rgb: var(--bad-rgb); }

  /* ---- the fact list: ROWS ---------------------------------------------
     Not 50 rounded boxes. Cards do not share edges, so N items become N
     separate objects with no rail for the eye; every craft reference here
     (Linear, Sentry, Primer, Grafana, NetNewsWire) uses rows inside one
     bounded surface with internal hairlines.
     -------------------------------------------------------------------- */
  .rows {
    background: var(--panel); border: 1px solid var(--line-soft);
    border-radius: var(--r-card); overflow: hidden;
  }
  .row {
    display: grid; grid-template-columns: 26px minmax(0, 1fr) auto;
    gap: 2px 14px; align-items: start;
    padding: 14px 18px; min-height: 44px;
    border-top: 1px solid var(--line-soft);
    text-decoration: none; color: inherit;
    transition: background-color .12s ease, box-shadow .12s ease;
  }
  .row:first-child { border-top: 0; }
  a.row:hover { background: var(--panel-hover); box-shadow: inset 2px 0 0 var(--accent); }
  a.row:focus-visible { outline-offset: -2px; border-radius: 0; }
  .row-main { min-width: 0; }
  .row-side {
    display: flex; flex-direction: column; align-items: flex-end; gap: 3px;
    font-size: 11.5px; color: var(--ink-3); font-variant-numeric: tabular-nums;
    white-space: nowrap; padding-top: 1px;
  }
  .row-side .id { font-family: var(--mono); font-size: 11px; }

  /* The tier is a fixed glyph in a fixed column — it becomes a scannable
     vertical rail instead of a pill that moves with the text. */
  .glyph {
    width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center;
    font-size: 11px; font-weight: 700; letter-spacing: 0;
    --hue: var(--ink-3); --hue-rgb: var(--ink-3-rgb);
    color: var(--hue);
    background: rgba(var(--hue-rgb), var(--tint));

  /* ---- THE GRAPH: the one dark region ---------------------------------
     Plot and rail are one object on one canvas, so the dark area reads as an
     instrument rather than as a rectangle someone forgot to theme. The rail
     carries the corpus count, the legend (click to isolate) and — only once
     something is pointed at — the record peek. An always-visible empty panel is
     the single most self-inflicted cause of a page looking under-populated, so
     it is not in the DOM until there is something in it.
     -------------------------------------------------------------------- */
  /* The instrument SIZES TO THE WINDOW. It is the hero of this view, and a
     fixed 620px box meant it started below the fold on a laptop and left the
     rail scrolling its own legend out of sight. `dvh` first so a mobile URL bar
     cannot lie about the height; `vh` for anything that does not know `dvh`.

  .instrument {
    display: grid; grid-template-columns: minmax(0, 1fr) 264px;
    background: var(--g-canvas); color: var(--g-ink);
    border: 1px solid var(--g-line); border-radius: var(--r-card);

    height: calc(100vh - 244px);

     status line grows ~45px — enough to buy back exactly the page scrollbar the
     viewport sizing exists to prevent, and to do it a beat AFTER first paint,
     because `paintStrip` sets `data-state` when the health read lands.
     `:has()` reads that state off the strip itself. An engine without `:has()`
     keeps the quiet-state subtraction and scrolls ~45px in warn/bad only.
     Gated above the stacked breakpoint: below it the instrument is `height:
     auto` by design, and this selector would out-specify that. */

    body:has(#health-strip[data-state="warn"]) .instrument,
    body:has(#health-strip[data-state="bad"]) .instrument {
      height: calc(100vh - 289px);
      height: calc(100dvh - 289px);
    }
  }
  #graph-wrap { min-width: 0; }
  #graph { display: block; width: 100%; height: 100%; touch-action: none; }
  #graph .edge { stroke-opacity: .32; }
  #graph .edge-super { stroke-opacity: .95; }
  #graph text {

    paint-order: stroke; stroke: var(--g-canvas); stroke-width: 3.5px; stroke-linejoin: round;

  #graph text.anchor-label { fill: var(--g-ink); font-weight: 600; }
  #graph text.lbl { opacity: 0; transition: opacity .12s ease; }
  #graph text.lbl-on { opacity: 1; }

  .key:focus-visible { outline: 2px solid var(--g-rim); outline-offset: 1px; }

<script>
/*
  THE THEME, stamped before the first paint.

  This is in the document head, above the body, on purpose: it is the one whose
  POSITION is the feature. Run it at the bottom of the document instead and a
  reader who chose light gets a dark page first and a light one a moment later —
  a flash on every single load, which is worse than either theme.

  It decides on exactly one input: what the reader last chose. NOT the system
  preference — that is the whole of the D-432 completion (see the note at the
  top of this file). With nothing stored, the answer is the kit's identity.

  It is also the page's ONLY writer of the choice, and the only place the
  storage key is spelled: the page script below reaches for `cmkTheme.toggle()`
  rather than keeping a second copy of any of this. The CSP is
  `default-src 'none'; script-src 'unsafe-inline'` — inline only, no host source
  — so an inline block is exactly what is allowed here and a `src=` would not
  load at all.
*/
(() => {
  'use strict';
  const KEY = 'cmk-viewer-theme';
  const root = document.documentElement;
  const clean = (t) => (t === 'light' ? 'light' : 'dark');
  const current = () => clean(root.dataset.theme);
  const apply = (t) => {
    root.dataset.theme = t;
    return t;
  };
  // `getItem` ITSELF throws in a blocked-storage profile, so the guard is around
  // the read and not only around the value it hands back. Anything that is not
  // one of the two themes is not a choice this page wrote: answer "no choice"
  // rather than stamping an attribute no CSS block answers.
  const recall = () => {
    try {
      const raw = localStorage.getItem(KEY);
      return raw === 'light' || raw === 'dark' ? raw : null;
    } catch {
      return null;
    }
  };
  // Persistence is best-effort; the FLIP is not. A profile with storage blocked
  // (private mode, a locked-down browser) fails here and the reader still gets
  // the theme they clicked — they are just asked again next time.
  const remember = (t) => {
    try {
      localStorage.setItem(KEY, t);
      return true;
    } catch {
      return false;
    }
  };
  const set = (t) => {
    const next = clean(t);
    remember(next);
    return apply(next);
  };
  window.cmkTheme = { KEY, current, set, toggle: () => set(current() === 'light' ? 'dark' : 'light') };
  apply(recall() || 'dark');
})();
</script>
</head>
<body>
<header>

           side of the switch you are on. Both are repainted by the page script.
           It is a WORD and not a moon glyph: a small quiet icon in the corner of
           the chrome is exactly the control nobody finds, and the ask that

       starts hidden so it cannot flash above the statusline before the first

<script>
(() => {
  'use strict';

  // ---- tiny helpers -----------------------------------------------------
  const $ = (sel) => document.querySelector(sel);
  const el = (tag, props = {}, kids = []) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(props)) {
      if (k === 'class') n.className = v;
      else if (k === 'text') n.textContent = v;
      else if (v !== null && v !== undefined) n.setAttribute(k, v);
    }
    for (const kid of [kids].flat()) if (kid) n.append(kid);
    return n;
  };
  const clear = (n) => n.replaceChildren();
  const group = (n) => (typeof n === 'number' ? n.toLocaleString('en-US') : n);

  // The ONLY request shape this page makes. No method, no body — GET is all
  // the server mounts, and all this page is allowed to want.
  async function api(path) {
    const res = await fetch('/api' + path, { headers: { accept: 'application/json' } });
    const data = await res.json().catch(() => ({ error: 'unreadable response' }));
    if (!res.ok && !data.error) data.error = 'request failed (' + res.status + ')';
    return data;
  }

  const hhmm = (iso) => {
    const d = iso ? new Date(iso) : new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  };

  // Freshness is stated per view, never implied (§24.1.6). The stamp is also
  // where the LIVE stream reports itself (Task 259): the base half is what this
  // view read and when, the suffix is whether the page is still being told about
  // changes. They are composed rather than concatenated at the call site because
  // either half can be repainted without the other — a view re-renders on
  // navigation, the stream changes state on its own schedule.
  let stampBase = 'as of —';
  let liveSuffix = '';
  function paintFreshness() {
    $('#freshness').textContent = stampBase + liveSuffix;
  }
  function stamp(payload, what) {
    stampBase = 'as of ' + hhmm(payload && payload.generated_at) + ' · ' + what;
    paintFreshness();
  }
  function setStampBase(text) {
    stampBase = text;
    paintFreshness();
  }

  function badge(text, cls) { return el('span', { class: 'badge ' + (cls || ''), text }); }

  // ---- view state lives in the URL (Task 269) ----------------------------
  //
  // Query, tier and page position are all URL parameters, so a position in the
  // archive is CITEABLE — you can paste "the page with that decision on it"
  // into a commit message and it still resolves tomorrow. That is the whole
  // reason this is a pager and not an infinite scroll: an infinite list has no
  // URL for where you are.
  function viewState() {
    const p = new URLSearchParams(location.search);
    const n = Number(p.get('offset'));
    return {
      q: (p.get('q') || '').trim(),
      tier: p.get('tier') || '',
      offset: Number.isInteger(n) && n > 0 ? n : 0,
    };
  }

  /** The current URL with some of the state replaced. */
  function hrefFor(patch) {
    const s = Object.assign(viewState(), patch);
    const p = new URLSearchParams();
    if (s.q) p.set('q', s.q);
    if (s.tier) p.set('tier', s.tier);
    if (s.offset) p.set('offset', String(s.offset));
    const qs = p.toString();
    return location.pathname + (qs ? '?' + qs : '');
  }

  // OFFSET RESET: any change to the QUERY or the TIER goes back to page 1.
  // This is the one predictable answer — carrying a page position across a
  // narrowing query lands the reader on "page 7 of 2 matches", an empty page
  // for a search that found something. Written with `replaceState`, not
  // `pushState`: typing must not leave one history entry per keystroke, which
  // would bury the page the reader arrived from under 30 near-identical URLs.
  // A PAGER click is the opposite — a deliberate navigation, so it pushes.
  function setQuery(patch) {
    history.replaceState({}, '', hrefFor(Object.assign({ offset: 0 }, patch)));
  }

  /**
   * Prev / next over a stable sort. Returns null when there is exactly one page
   * — a pager on a list that does not page is furniture.
   *
   * Both controls are real anchors carrying the whole view state, so
   * middle-click, copy-link and the back button all work. An unavailable
   * direction renders as a SPAN, never a dead link.
   */
  function pager(data, noun) {
    if (!data || typeof data.total !== 'number') return null;
    const offset = typeof data.offset === 'number' ? data.offset : 0;
    const limit = typeof data.limit === 'number' && data.limit > 0 ? data.limit : 50;
    const count = data.count || 0;
    const total = data.total;
    const reachable = typeof data.reachable === 'number' ? data.reachable : total;
    if (offset === 0 && !data.has_more) return null;

    const nav = el('nav', { class: 'pager', 'aria-label': noun + ' pages' });
    nav.append(offset > 0
      ? el('a', { class: 'page-btn', href: hrefFor({ offset: Math.max(0, offset - limit) }), text: '← Previous', 'aria-label': 'Previous page of ' + noun })
      : el('span', { class: 'page-btn-off', text: '← Previous', 'aria-disabled': 'true' }));

    const range = el('span', { class: 'range' });
    if (count > 0) {
      range.append('Showing ');
      range.append(el('b', { text: group(offset + 1) + '–' + group(offset + count) }));
      range.append(' of ');
      range.append(el('b', { text: group(total) }));
      range.append(' ' + noun + '.');
    } else {
      range.append('No ' + noun + ' on this page.');
    }
    // Said out loud rather than hidden behind a disabled button: a ranked
    // result set is only pageable to the engine's ranking depth.
    if (reachable < total) {
      range.append(' Paging reaches the first ' + group(reachable) + ' — narrow the search for the rest.');
    }
    nav.append(range);

    // Advance by the PAGE SIZE, not by `count`. They are the same number on
    // every ordinary page, and they differ exactly when a hit was dropped
    // because its fact row could not be resolved (the Task-270 orphan class):
    // stepping by `count` there would re-serve the window it already showed and
    // walk the reader in circles. The server computes `has_more` from the same
    // window for the same reason.
    nav.append(data.has_more
      ? el('a', { class: 'page-btn', href: hrefFor({ offset: offset + limit }), text: 'Next →', 'aria-label': 'Next page of ' + noun })
      : el('span', { class: 'page-btn-off', text: 'Next →', 'aria-disabled': 'true' }));
    return nav;
  }

  // The denominator behind the headline figure, and it rides on the SAME
  // payload as the rows (`/api/facts` states `total` in both modes). It used to
  // be fetched from `/api/graph` when the facts payload did not state one —
  // which meant a COUNT, an edge SELECT and an archive walk on every facts
  // page-load to paint one number, AND a number counted with different filters
  // than the list it sat over.
  const readTotal = (data) =>
    data && typeof data.total === 'number' ? data.total : null;

  // ---- rendering untrusted text -----------------------------------------
  //
  // NOTHING below parses HTML. The page's XSS defense is that every character
  // of fact content reaches the DOM as a text node, or as the text of an
  // element this code created (design §24.1.1 — and a test scans this script
  // for the parsing sinks). The markdown handling is therefore a TOKENIZER
  // over plain strings, deliberately.
  //
  // Segment kinds: 'text' | 'code' | 'strong' | 'hit'. A 'hit' is an FTS match
  // marker (the search route wraps matches in <b>…</b>); it is re-created as a
  // real <b> element, never interpolated.
  // The block between the region markers below is extracted VERBATIM by
  // tests/cli-viewer.test.js and run against a ~20-line element shim. It
  // depends on `el` and nothing else; keep it that way, and keep each marker
  // alone on its line.
  // #region text-render
  const MD_INLINE = /`([^`\n]+)`|\*\*([^*\n]+)\*\*|__([^_\n]+)__|\[([^\]\n]+)\]\([^)\n]*\)/g;

  function inlineSegments(text, blocks) {
    let s = String(text || '');
    if (blocks) {
      // A leading list bullet or heading hash is structure a one-line snippet
      // cannot show anyway: drop the marker, keep the words.
      s = s.replace(/^[ \t]*(?:[-*+]|\d+[.)])[ \t]+/gm, '').replace(/^[ \t]*#{1,6}[ \t]+/gm, '');
    }
    const out = [];
    let last = 0;
    let m;
    MD_INLINE.lastIndex = 0;
    while ((m = MD_INLINE.exec(s)) !== null) {
      if (m.index > last) out.push({ kind: 'text', s: s.slice(last, m.index) });
      if (m[1] !== undefined) out.push({ kind: 'code', s: m[1] });
      else if (m[2] !== undefined) out.push({ kind: 'strong', s: m[2] });
      else if (m[3] !== undefined) out.push({ kind: 'strong', s: m[3] });
      else out.push({ kind: 'text', s: m[4] });
      last = m.index + m[0].length;
    }
    if (last < s.length) out.push({ kind: 'text', s: s.slice(last) });
    return out;
  }

  function segmentsOf(raw, blocks) {
    const out = [];
    let rest = String(raw || '');
    while (rest.length) {
      const open = rest.indexOf('<b>');
      if (open === -1) { out.push(...inlineSegments(rest, blocks)); break; }
      if (open) out.push(...inlineSegments(rest.slice(0, open), blocks));
      const close = rest.indexOf('</b>', open);
      if (close === -1) { out.push(...inlineSegments(rest.slice(open + 3), blocks)); break; }
      out.push({ kind: 'hit', s: rest.slice(open + 3, close) });
      rest = rest.slice(close + 4);
    }
    return out;
  }

  function renderSegments(into, segs) {
    for (const seg of segs) {
      if (seg.kind === 'code') into.append(el('code', { text: seg.s }));
      else if (seg.kind === 'strong') into.append(el('strong', { text: seg.s }));
      else if (seg.kind === 'hit') into.append(el('b', { text: seg.s }));
      else into.append(seg.s);
    }
    return into;
  }

  const plainOf = (segs) => segs.map((x) => x.s).join('');

  function sliceSegments(segs, from, to) {
    const out = [];
    let pos = 0;
    for (const seg of segs) {
      const start = pos;
      pos += seg.s.length;
      if (pos <= from || start >= to) continue;
      const s = seg.s.slice(Math.max(0, from - start), Math.min(seg.s.length, to - start));
      if (s) out.push({ kind: seg.kind, s });
    }
    return out;
  }

  // Where the title ends and the body begins. The server sends ONE flattened
  // string per fact and its shape is pinned by a route test, so the two
  // typographic tiers are made HERE rather than by changing the payload.
  //
  // Boundaries are looked for in PROSE only: a `.` inside a backticked command
  // is not the end of a sentence.
  const TITLE_MIN = 14;
  const TITLE_MAX = 150;
  const TITLE_WHOLE = 90;    // shorter than this and the fact IS its own title
  const TITLE_CLAUSE = 160;  // the weaker comma boundary reaches a little further
  const TITLE_FALLBACK = 110;
  const BOUNDARY = /([.!?])(?=\s|$)|\s*[—–]\s*|:\s|\n/g;
  const CLAUSE = /,\s/g;

  /** Scan the PROSE segments only, and report the first boundary in range. */
  function scanBoundary(segs, rx, min, max, last) {
    let found = null;
    let pos = 0;
    for (const seg of segs) {
      const start = pos;
      pos += seg.s.length;
      if (seg.kind === 'code' || start > max) continue;
      rx.lastIndex = 0;
      let m;
      while ((m = rx.exec(seg.s)) !== null) {
        const at = start + m.index;
        if (at < min) continue;
        if (at > max) break;
        // Keep sentence-ending punctuation in the title; drop a separator.
        const hit = { titleTo: at + (m[1] ? m[1].length : 0), restFrom: at + m[0].length };
        if (!last) return hit;
        found = hit;
      }
    }
    return found;
  }

  function titleSplit(segs) {
    const plain = plainOf(segs);
    if (plain.length <= TITLE_WHOLE) return { titleTo: plain.length, restFrom: plain.length };
    // A LINE BREAK outranks everything and ignores TITLE_MIN: a short first line
    // ("**What changed:**") is a heading, which is precisely what a title is.
    const nl = plain.indexOf('\n');
    if (nl > 0 && nl <= TITLE_MAX) return { titleTo: nl, restFrom: nl + 1 };
    // Otherwise a sentence end / dash / colon, first one wins.
    const strong = scanBoundary(segs, BOUNDARY, TITLE_MIN, TITLE_MAX, false);
    if (strong) return strong;
    // Failing that, the LAST clause break in range — a full clause reads as a
    // lede where half of one reads as a truncation.
    const clause = scanBoundary(segs, CLAUSE, TITLE_MIN * 3, TITLE_CLAUSE, true);
    if (clause) return { titleTo: clause.titleTo + 1, restFrom: clause.restFrom };
    // And failing THAT, lead with as much as reads as one thought.
    const cut = plain.lastIndexOf(' ', TITLE_FALLBACK);
    if (cut < TITLE_MIN) return { titleTo: plain.length, restFrom: plain.length };
    return { titleTo: cut, restFrom: cut + 1 };
  }

  /**
   * A record's text tiers.
   *
   * `clamp` is the LIST mode: the snippet arrives already flattened to one line
   * by the server, every row must be one height, and a leading `- ` on a line
   * that can no longer show a list is noise — so markers are stripped.
   *
   * The DETAIL view is the opposite case on every count: real multi-line body,
   * nothing clamped, the record's own structure is the point — so it keeps its
   * markers and its line breaks.
   */
  function factText(raw, clamp) {
    const segs = segmentsOf(raw, clamp);
    const { titleTo, restFrom } = titleSplit(segs);
    const nodes = [];
    const title = el('div', { class: clamp ? 'fact-title clamp-2' : 'd3 pre' });
    renderSegments(title, sliceSegments(segs, 0, titleTo));
    nodes.push(title);
    const plain = plainOf(segs);
    if (restFrom < plain.length) {
      const body = el('div', { class: clamp ? 'snippet clamp-2' : 'snippet pre' });
      renderSegments(body, sliceSegments(segs, restFrom, plain.length));
      nodes.push(body);
    }
    return nodes;
  }

  /** Full prose (Why / How / a decision's rationale): markdown-aware, unclamped. */
  function richBody(raw) {
    return renderSegments(el('div', { class: 'body' }), segmentsOf(raw, false));
  }
  // #endregion text-render

  function copyRow(label, command) {
    const code = el('code', { text: command });
    const btn = el('button', { type: 'button', text: 'Copy' });
    btn.addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(command);
        btn.textContent = 'Copied';
      } catch {
        // No clipboard permission (or an old browser): select it so ⌘/Ctrl-C
        // still works. Never leave the user with a dead button.
        const r = document.createRange();
        r.selectNodeContents(code);
        const s = window.getSelection();
        s.removeAllRanges(); s.addRange(r);
        btn.textContent = 'Selected — press Ctrl/⌘-C';
      }
      setTimeout(() => { btn.textContent = 'Copy'; }, 2200);
    });
    return el('div', { class: 'cmd', title: label }, [code, btn]);
  }

  function errorCard(data) {
    return el('div', { class: 'card' }, [
      el('div', { class: 'd3', text: 'Could not read this view.' }),
      el('div', { class: 'snippet', text: String(data && data.error || 'unknown error') }),
    ]);
  }

  // ---- the pinned health strip (every view) -----------------------------
  //
  // `?strip=1` deliberately: the strip is on EVERY view, and the full health
  // route runs the whole doctor check list (one check probes the agent CLI as a
  // subprocess). Paying that on every navigation to draw one line would make
  // the whole viewer feel broken.
  function applyStrip(s) {
    const strip = $('#health-strip');
    if (s.state === 'warn') strip.dataset.state = s.severity === 'memory-off' ? 'bad' : 'warn';
    else if (s.state === 'queued') strip.dataset.state = 'queued';
    else strip.dataset.state = 'ok';
    $('#health-strip-text').textContent = s.text + (s.action ? ' — run `' + s.action + '`' : '');
  }

  async function paintStrip() {
    const data = await api('/health?strip=1');
    const strip = $('#health-strip');
    if (data.error) {
      strip.dataset.state = 'warn';
      $('#health-strip-text').textContent = 'health could not be read: ' + data.error;
      return data;
    }
    applyStrip(data.strip || {});
    $('#health-strip-fix').classList.remove('hidden');
    return data;
  }

  // The health VIEW has the doctor table, so its strip is the authoritative
  // one — repaint the pinned line from it rather than leaving the cheaper
  // quick-check wording sitting above a table that contradicts it.
  function repaintStripFrom(data) {
    if (!data || !data.strip) return;
    applyStrip(data.strip);
  }

  // ---- views ------------------------------------------------------------
  //
  // The search box fires per keystroke (debounced), so two requests can be in
  // flight at once whenever a query outruns the debounce — and responses are
  // not ordered. Without this token the SLOWER, OLDER response can land last
  // and repaint the list with results for a prefix the user already finished
  // typing.
  let factsSeq = 0;

  // The overview states the corpus. The most impressive true thing about this
  // product — every durable fact still here — was never on screen; now it is the
  // largest type on the page, with the fraction currently listed underneath it.
  function paintOverview(data, q, tier) {
    const figure = $('#ov-figure');
    const label = $('#ov-label');
    const sub = $('#ov-sub');
    const shown = data && data.facts ? data.facts.length : 0;
    const total = readTotal(data);
    const tail = tier ? ' · tier ' + tier + ' only' : '';
    // Task 269: past page 1, "showing the FIRST 50" is simply false — the rows
    // below are 51–100. The pager states the true range, and an overview that
    // contradicts the control under it is worse than one that says less. So on
    // a paged view the sub-line drops the claim and defers to the pager.
    const paged = !!(data && data.offset);
    if (paged) {
      label.textContent = data.mode === 'search'
        ? 'Search'
        : (tier ? 'Durable memory · tier ' + tier : 'Durable memory');
      figure.textContent = total !== null ? group(total) : group(shown);
      clear(sub);
      sub.append(data.mode === 'search'
        ? 'matches for “' + (data.query || q) + '” — the range you are looking at is below the list.'
        : 'facts on disk, none forgotten — the range you are looking at is below the list.');
      return;
    }
    if (data && data.mode === 'search') {
      // The figure is the MATCH COUNT, not the page of it. Showing `count` here
      // rendered "50 matches" for a 500-hit query, in the largest type on the
      // page — the one number a user has no way to check.
      const hits = total !== null ? total : (typeof data.count === 'number' ? data.count : shown);
      label.textContent = 'Search';
      figure.textContent = group(hits);
      clear(sub);
      sub.append('match' + (hits === 1 ? '' : 'es') + ' for ');
      sub.append(el('b', { text: '“' + (data.query || q) + '”' }));
      if (hits > shown) {
        sub.append(' — showing the first ');
        sub.append(el('b', { text: group(shown) }));
        sub.append(', ranked by trust' + tail + '.');
      } else {
        sub.append(' — keyword, ranked by trust' + tail + '.');
      }
      return;
    }
    label.textContent = tier ? 'Durable memory · tier ' + tier : 'Durable memory';
    figure.textContent = total !== null ? group(total) : group(shown);
    clear(sub);
    if (total !== null && total > shown) {
      sub.append('facts on disk, none forgotten. Listing the newest ');
      sub.append(el('b', { text: group(shown) }));
      sub.append(' — search reaches all of them.');
    } else if (total !== null) {
      sub.append('facts on disk, none forgotten — all of them listed below.');
    } else {
      sub.append('facts listed, newest first. Search reaches the whole store.');
    }
  }

  // The three bands the server hands back, and the class + WORD each one shows.
  // A Map, not an object literal: the class name must come from THIS table and
  // never from the payload, and an object lookup gated on truthiness would let
  // a band of `constructor` or `toString` through the gate and then interpolate
  // the payload's own string into the class attribute. A Map has no prototype
  // chain to inherit past, so the lookup is closed by construction rather than
  // by a comment claiming it is (review M5).
  const REL = new Map([
    ['strong', { cls: 'rel-strong', word: 'strong match' }],
    ['fair', { cls: 'rel-fair', word: 'fair match' }],
    ['weak', { cls: 'rel-weak', word: 'weak match' }],
  ]);

  function factRow(f) {
    const row = el('a', { class: 'row', href: '/fact/' + f.id });
    row.append(el('span', { class: 'glyph tier-' + f.tier, text: f.tier, title: 'tier ' + f.tier }));
    const main = el('div', { class: 'row-main' });
    for (const node of factText(f.snippet, true)) main.append(node);
    const meta = el('div', { class: 'meta' });
    // Relevance first in the meta row: on a search result it is the thing that
    // decides whether the row is worth reading at all. The tooltip states what
    // the number IS — relative to the top hit, not an absolute confidence —
    // because a coloured pill invites the stronger reading.
    const rel = REL.get(f.relevance_band);
    if (rel) {
      meta.append(el('span', {
        class: 'badge ' + rel.cls,
        text: rel.word,
        title: 'Relevance ' + Number(f.relevance).toFixed(2) + ' — relative to the strongest match for this query, not an absolute score.',
      }));
    }
    if (f.trust) meta.append(el('span', { class: 'trust trust-' + f.trust, text: f.trust + ' trust' }));
    if (f.state) meta.append(badge(f.state, 'state'));
    if (f.write_source) meta.append(el('span', { text: f.write_source }));
    if (meta.childElementCount) main.append(meta);
    row.append(main);
    row.append(el('div', { class: 'row-side' }, [
      f.date ? el('span', { text: f.date }) : null,
      el('span', { class: 'id', text: f.id }),
    ]));
    return row;
  }

  async function viewFacts() {
    const seq = ++factsSeq;
    const out = $('#facts-out');
    // The URL is the state, not the controls: a deep link with `?q=…&offset=…`
    // must paint the same page the controls would have.
    const { q, tier, offset } = viewState();
    const params = new URLSearchParams();
    if (q) params.set('q', q);
    if (tier) params.set('tier', tier);
    if (offset) params.set('offset', String(offset));
    const data = await api('/facts' + (params.toString() ? '?' + params : ''));
    if (seq !== factsSeq) return; // a newer query went out while this one flew
    clear(out);
    if (data.error) { out.append(errorCard(data)); return; }
    // The stamp counts what the QUERY found, not what this response carried —
    // otherwise the freshness line contradicts the headline figure above it.
    const found = readTotal(data);
    stamp(data, data.mode === 'search'
      ? (found !== null ? found : data.count) + ' hit(s) for “' + data.query + '”'
      : 'newest ' + data.count);
    paintOverview(data, q, tier);
    if (!data.facts.length) {
      // An empty PAGE is not an empty result: an over-shot `?offset=` on a
      // query that matched 2,300 facts would otherwise read "nothing matches",
      // which is false, and strand the reader with no control to get back.
      const overshot = data.offset > 0;
      out.append(el('p', { class: 'empty', text: overshot
        ? 'No facts on this page — you have paged past the end of ' + (q ? 'these matches.' : 'the list.')
        : q
          ? 'Nothing matches “' + q + '”. Try fewer words — search is keyword, not fuzzy.'
          : 'No memory captured here yet. It fills as you work; `cmk remember` captures one by hand.' }));
      if (overshot) {
        const back = pager(data, 'facts');
        if (back) out.append(back);
        out.append(el('p', { class: 'note' }, el('a', { class: 'chip', href: hrefFor({ offset: 0 }), text: '← back to the first page' })));
      }
      return;
    }
    const rows = el('div', { class: 'rows' });
    for (const f of data.facts) rows.append(factRow(f));
    out.append(rows);
    // The pager replaced the "showing the first N of M" note that used to sit
    // here: that line stated the shortfall and offered nothing to do about it,
    // which was the whole D-426 finding one layer up.
    const nav = pager(data, 'facts');
    if (nav) out.append(nav);
  }

  async function viewFact(id) {
    const out = $('#fact-out');
    const data = await api('/fact/' + encodeURIComponent(id));
    clear(out);
    if (data.error || data.found === false) {
      out.append(errorCard({ error: data.error || ('no fact with id ' + id) }));
      stamp(data, 'fact');
      return;
    }
    stamp(data, 'fact ' + data.fact.id);
    const f = data.fact;
    out.append(el('div', { class: 'chips', style: 'margin-bottom:18px' },
      [el('a', { class: 'chip', href: '/facts', text: '← all memory' })]));

    const head = el('div', { class: 'record-head' });
    for (const node of factText(f.headline || f.snippet, false)) head.append(node);
    const meta = el('div', { class: 'meta' });
    meta.append(el('span', { class: 'glyph tier-' + f.tier, text: f.tier, title: 'tier ' + f.tier }));
    if (f.trust) meta.append(el('span', { class: 'trust trust-' + f.trust, text: f.trust + ' trust' }));
    if (f.state) meta.append(badge(f.state, 'state'));
    if (f.date) meta.append(el('span', { text: f.date }));
    if (f.write_source) meta.append(el('span', { text: f.write_source }));
    meta.append(el('span', { class: 'mono', text: f.id }));
    head.append(meta);
    out.append(head);

    // Trust is two numbers, not one label: the declared tier and the LEARNED
    // score with the count of outcome signals behind it.
    if (typeof f.trust_score === 'number') {
      out.append(el('div', { class: 'block' }, [
        el('h3', { text: 'Trust' }),
        el('div', { class: 'body', text:
          'declared ' + f.trust + ' · learned score ' + f.trust_score.toFixed(2) +
          ' from ' + (f.signal_count || 0) + ' outcome signal(s)' +
          ((f.signal_count || 0) < 3 ? ' — not yet enough evidence to move search ranking' : '') }),
      ]));
    }

    if (f.why) out.append(el('div', { class: 'block' }, [el('h3', { text: 'Why' }), richBody(f.why)]));
    if (f.how) out.append(el('div', { class: 'block' }, [el('h3', { text: 'How to apply' }), richBody(f.how)]));

    if (data.supersession && data.supersession.length > 1) {
      const chips = el('div', { class: 'chips' });
      data.supersession.forEach((sid, i) => {
        chips.append(el('a', { class: 'chip', href: '/fact/' + sid, text: (i ? '→ ' : '') + sid + (sid === f.id ? ' (this one)' : '') }));
      });
      out.append(el('div', { class: 'block' }, [el('h3', { text: 'Supersession — oldest to newest' }), chips]));
    }

    const links = el('div', { class: 'chips' });
    for (const e of data.edges.out) {
      links.append(el('a', { class: 'chip', href: e.resolved ? '/fact/' + e.dst : '/graph', text: e.type + ' → ' + e.dst + (e.resolved ? '' : ' (unresolved)') }));
    }
    for (const e of data.edges.in) {
      links.append(el('a', { class: 'chip', href: '/fact/' + e.src, text: e.src + ' → ' + e.type + ' (here)' }));
    }
    if (links.childElementCount) out.append(el('div', { class: 'block' }, [el('h3', { text: 'Edges' }), links]));

    out.append(el('div', { class: 'block' }, [
      el('h3', { text: 'Source' }),
      el('div', { class: 'mono muted', text: f.source_file + ':' + f.source_line }),
    ]));

    // §24.1.3 — the read-only answer to the field's #1 viewer demand. Copy it,
    // run it in your shell; the safe write path stays the only writer. An
    // ARCHIVED record gets a state note instead of buttons: the commands do not
    // apply to a fact that has left the live corpus.
    if (data.state_note) {
      const note = el('div', { class: 'block' }, [el('h3', { text: 'State' })]);
      const card = el('div', { class: 'card' });
      card.append(el('div', { class: 'snippet', text: data.state_note.text }));
      if (data.state_note.superseded_by) {
        card.append(el('div', { class: 'chips spaced' }, [
          el('a', { class: 'chip', href: '/fact/' + data.state_note.superseded_by, text: 'open the current version → ' + data.state_note.superseded_by }),
        ]));
      }
      note.append(card);
      out.append(note);
      return;
    }

    const cmds = el('div', { class: 'block' }, [el('h3', { text: 'Change it from your shell' })]);
    // `--yes` is on the server's string: what you paste has to be what runs.
    cmds.append(copyRow('forget this fact', data.commands.forget));
    cmds.append(copyRow('read it in the terminal', data.commands.get));

    // The trust ladder as a TEMPLATE rather than one echoed command. Every level
    // is offered; the one the fact is already at is marked and has no copy
    // button, because there is nothing to run.
    const trust = el('div', { class: 'block' }, [
      el('h3', { text: 'Re-rate it' }),
      el('div', { class: 'body', text: 'Currently ' + (data.commands.trust_current || 'unrated') + '. Copy the level you want:' }),
    ]);
    for (const opt of data.commands.trust_options) {
      if (opt.current) {
        trust.append(el('div', { class: 'cmd' }, [
          el('code', { text: opt.command }),
          el('span', { class: 'muted', text: 'current — nothing to change' }),
        ]));
      } else {
        trust.append(copyRow('set trust to ' + opt.level, opt.command));
      }
    }
    out.append(cmds);
    out.append(trust);
  }
